# PyTorch Training Parameters
model:
  backbone_arch: dinov2_vitb14
  backbone_config: 
    num_trainable_blocks: 2
    return_token: True
    norm_layer: True
    domain_prompt: "none"
    num_clusters: 16
    cluster_dim: 16
    token_dim: 256
    dropout: 0.3
    freeze: "none"
    divide_ratio: [1, 1, 1, 0]
    divide: 1
    multi_scale: "1"
  agg_arch: SALAD
  agg_config:
    num_channels: 768
    num_clusters: 64
    cluster_dim: 128
    token_dim: 256
    dropout: 0.3
    freeze: "none"
    divide_ratio: [1, 1, 1, 0]
    divide: 1
    num_queries: 64

datasets:
  train_datasets: 
    - mapillary_sls
  val_datasets: 
    - pitts30k
    - pitts250k
    - mapillary_sls
    - svox
    - SF_XL
  test_datasets:
    - pitts30k
    - pitts250k
    - mapillary_sls
    - svox
    - tokyo247
    - SPED
    - nordland
    - nordland_subset
    - amstertime
    - eynsham
  target_val_dataset: mapillary_sls
training:
  num_epochs: 80
  train_batch_size: 30
  test_batch_size: 256
  img_per_place: 4
  num_workers: 4
  sampled_similar_places: 15
  num_processes: 15
  num_batches: 4000
  train_image_size: [224, 224]
  test_image_size: [322, 322]
  optimizer:
    name: AdamW
    lr: 1e-5
    backbone_lr: 8e-6
    weight_decay: 1e-3
    momentum: 0.9
  scheduler:
    name: multistep
    args:
      gamma: 0.1
      milestones:
        - 80
      total_iters: 4000
  loss:
    name: 'MultiSimilarityLoss'
  miner:
    name: 'MultiSimilarityMiner'
    margin: 0.1
  faiss_gpu: False
  recompute_clusters: True
  prefetch_factor: 1
  recompute_desc: True
  recompute_interval: 4
  decorrelation: "none"
  decorrelation_lambda_std: 25.0
  decorrelation_lambda_cov: 1.0